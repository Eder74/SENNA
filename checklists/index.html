<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script src="../assets/firebase-config.js"></script>
<script src="../assets/senna-runtime.js" data-modulo="checklists"></script>
<link rel="stylesheet" href="../assets/app.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#001A72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S.E.N.N.A.">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S.E.N.N.A. - Checklists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto+Slab:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --laranja:#FE5000; --laranja-forte:#D94400; --azul:#001A72; --azul-2:#0B2A8F;
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#F8F9FB; --line:#E1E4EB; --line-2:#C9CEDA;
  --text:#121A33; --muted:#5A6378; --soft:#8A92A6;
  --ok:#14804A; --ok-bg:#E6F4EC; --warn:#A15C00; --warn-bg:#FFF2DC; --bad:#C42B1C; --bad-bg:#FDECEA;
  --chip:#EEF1F8; --linha:#0B2A8F; --header:#001A72; --on-header:#FFFFFF; --focus:#FE5000;
  color-scheme: light;
  --sans:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --slab:"Roboto Slab",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#141B30; --surface-2:#1A2240; --line:#263052; --line-2:#36426B;
    --text:#E9ECF5; --muted:#A3ABC2; --soft:#7C86A3;
    --ok:#4CC38A; --ok-bg:#12301F; --warn:#F0B35A; --warn-bg:#3A2A10; --bad:#FF7A6B; --bad-bg:#3A1612;
    --chip:#1E2747; --linha:#8FA8FF; --header:#0A1340; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#141B30; --surface-2:#1A2240; --line:#263052; --line-2:#36426B;
  --text:#E9ECF5; --muted:#A3ABC2; --soft:#7C86A3;
  --ok:#4CC38A; --ok-bg:#12301F; --warn:#F0B35A; --warn-bg:#3A2A10; --bad:#FF7A6B; --bad-bg:#3A1612;
  --chip:#1E2747; --linha:#8FA8FF; --header:#0A1340; color-scheme: dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--header)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img{max-width:100%}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header);color:var(--on-header)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 18px}
.marca{display:flex;align-items:baseline;gap:10px;min-width:0}
.marca b{font-family:var(--slab);font-weight:800;font-size:22px;letter-spacing:.06em}
.marca span{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--on-header);text-decoration:none;font-weight:600;font-size:14px;padding:8px 12px;border-radius:8px;white-space:nowrap;opacity:.82}
nav.tabs a:hover{opacity:1;background:rgba(255,255,255,.08)}
nav.tabs a[aria-current="page"]{opacity:1;background:var(--laranja);color:#fff}
.zebra{height:6px;background:repeating-linear-gradient(90deg,var(--laranja) 0 14px,#fff 14px 28px)}
.zebra.fina{height:4px}

main{max-width:1180px;margin:0 auto;padding:22px 18px 120px}
h1{font-size:24px;line-height:1.25;margin:0 0 4px;font-weight:800}
h2{font-size:18px;margin:0 0 12px;font-weight:700}
h3{font-size:15px;margin:0 0 8px;font-weight:700}
p{margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.kpi .n{font-family:var(--slab);font-weight:800;font-size:30px;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--azul)}
.btn.pri{background:var(--laranja);border-color:var(--laranja);color:#fff}
.btn.pri:hover{background:var(--laranja-forte);border-color:var(--laranja-forte)}
.btn.azul{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.peq{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.luz{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.luz.verde{background:var(--ok)}.luz.amarela{background:#E9A200}.luz.vermelha{background:var(--bad)}.luz.cinza{background:var(--line-2)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px}
textarea{min-height:76px;resize:vertical}
.aviso{border-radius:12px;padding:12px 14px;background:var(--warn-bg);color:var(--warn);font-weight:500;margin-bottom:14px}
.aviso.erro{background:var(--bad-bg);color:var(--bad)}
.aviso.info{background:var(--chip);color:var(--muted)}
.vazio{color:var(--muted);text-align:center;padding:28px 10px}
.mini{font-size:12.5px;color:var(--muted)}
.tabela-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:700}

/* lojas */
.lojas{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.loja{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.loja:hover{border-color:var(--azul)}
.loja .topo{display:flex;gap:12px;align-items:center}
.selo-mini{width:54px;height:54px;flex:none}
.selo-card{width:104px;height:104px;flex:none}
.selo-card svg{width:100%;height:100%;display:block}
.selo-vazio.selo-card{width:104px;height:104px;font-size:22px}
@media (max-width:720px){.selo-card{width:88px;height:88px}}
.selo-mini svg,.selo-grande svg{width:100%;height:100%;display:block}
.selo-vazio{width:54px;height:54px;border-radius:50%;border:2px dashed var(--line-2);display:flex;align-items:center;justify-content:center;color:var(--soft);font-weight:700;flex:none}
.nota{font-family:var(--slab);font-weight:800;font-size:26px;line-height:1}
.loja .nome{font-weight:700;font-size:16px}
.spark{width:100%;height:34px}

/* avaliar */
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--laranja);border-radius:99px;transition:width .25s}
.area{margin-bottom:14px;padding:0;overflow:hidden}
.area>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.area>summary::-webkit-details-marker{display:none}
.area>summary .t{font-weight:700;font-size:16px}
.area>summary .c{margin-left:auto;display:flex;gap:8px;align-items:center}
.area[open]>summary{border-bottom:1px solid var(--line)}
.item{padding:14px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .q{font-weight:600;margin-bottom:6px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.resp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px}
.resp button[aria-pressed="true"][data-r="NV"]{background:#7A5A00;border-color:#7A5A00;color:#fff}
.chip.foco{background:rgba(254,80,0,.14);color:var(--laranja-forte)}
.item-foco{box-shadow:inset 4px 0 0 var(--laranja)}
.motivo{font-size:13px;color:var(--laranja-forte);font-weight:600;margin:-4px 0 10px}
.rapida{background:var(--surface-2);border-top:1px dashed var(--line-2)}
.rapida .item{padding:10px 16px}
.card.brief{margin-bottom:14px;border-left:4px solid var(--laranja)}
@media (max-width:560px){.resp{grid-template-columns:repeat(2,1fr)}}
.resp button{border:1.5px solid var(--line-2);background:var(--surface);border-radius:10px;padding:11px 6px;font-weight:700;font-size:14.5px}
.resp button[aria-pressed="true"][data-r="S"]{background:var(--ok);border-color:var(--ok);color:#fff}
.resp button[aria-pressed="true"][data-r="N"]{background:var(--bad);border-color:var(--bad);color:#fff}
.resp button[aria-pressed="true"][data-r="NA"]{background:var(--muted);border-color:var(--muted);color:#fff}
.det{margin-top:12px;display:grid;gap:10px}
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.foto{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;padding:0}
.addfoto{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;text-align:center}
.reinc{color:var(--bad);font-weight:700}
.barra-fim{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px))}
.barra-fim .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px}
.barra-fim .np{font-family:var(--slab);font-weight:800;font-size:22px}
canvas.ass{width:100%;height:170px;border:1.5px dashed var(--line-2);border-radius:12px;background:#fff;touch-action:none;display:block}

/* relatorio */
.rel-head{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.selo-grande{width:150px;height:150px}
.nota-g{font-family:var(--slab);font-weight:800;font-size:56px;line-height:1}
.barras{display:grid;gap:10px}
.barra{display:grid;grid-template-columns:minmax(120px,210px) 1fr 64px 86px;gap:10px;align-items:center;font-size:14px}
.barra .trilho{height:14px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.barra .trilho i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.barra .pct{font-weight:700;text-align:right}
.barra .var{font-size:12.5px;text-align:right}
.var.up{color:var(--ok)}.var.down{color:var(--bad)}.var.eq{color:var(--muted)}
.ponto{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.ponto:last-child{border-bottom:0}
.ponto .com{grid-column:1/-1;color:var(--muted);font-size:14px}
.ponto .fotos{grid-column:1/-1}
.ass-img{max-width:280px;background:#fff;border-radius:10px;border:1px solid var(--line)}
.hash{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,10,30,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:20px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:220px;border:2px dashed var(--line-2);cursor:pointer;color:var(--text)}
.drop:hover,.drop.sobre{border-color:var(--laranja);background:var(--surface-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--azul);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media (max-width:720px){
  .top-in{flex-wrap:wrap;gap:8px 12px;padding:10px 14px}
  nav.tabs{margin-left:0;width:100%}
  main{padding:16px 14px 130px}
  .rel-head{grid-template-columns:1fr;justify-items:center;text-align:center}
  .barra{grid-template-columns:1fr 54px;grid-template-areas:"n p" "t t" "v v"}
  .barra .nm{grid-area:n}.barra .pct{grid-area:p}.barra .trilho{grid-area:t}.barra .var{grid-area:v;text-align:left}
}
@media print{
  header.top,.barra-fim,.no-print,.toast{display:none!important}
  body{background:#fff}
  .card{border-color:#ccc;break-inside:avoid}
  main{padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    <div class="marca"><b>S.E.N.N.A.</b><span>- Checklists</span></div>

      <a href="#importar" data-v="importar">Importar dados</a>
      <a href="#configurar" data-v="configurar">Configurar</a>

  </div>

</header>
<main id="app" aria-live="polite"><p class="vazio">Carregando…</p></main>
<div id="barra"></div>
<div id="modal"></div>
<div id="toast" class="toast hidden" role="status"></div>
<input type="file" id="arqFoto" accept="image/*" capture="environment" class="hidden">
<input type="file" id="arqImport" accept=".xlsx,.xls" multiple class="hidden">

<script>
(()=>{"use strict";
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf1=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const pct=v=>v==null?'—':nf.format(v)+'%';
const dataBR=iso=>iso?new Date(iso).toLocaleDateString('pt-BR'):'—';
const horaBR=iso=>iso?new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const dias=(a,b=new Date())=>Math.floor((new Date(b)-new Date(a))/864e5);
const addDias=(iso,n)=>{const d=new Date(iso||Date.now());if(isNaN(d))return new Date().toISOString();d.setDate(d.getDate()+n);return d.toISOString();};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hidden'),2600);}
function faixa(n){if(n==null)return null;return n>=95?'A':n>=80?'B':n>=65?'C':n>=45?'D':'E';}
const FAIXA_TXT={A:'Loja referência',B:'Loja boa',C:'Atenção da Prevenção',D:'Crítica',E:'Crítica'};
function selo(f,cls='selo-mini'){return f?`<div class="${cls}" role="img" aria-label="Selo ${f}">${SELOS[f]}</div>`:`<div class="selo-vazio ${cls}" aria-label="Sem nota">–</div>`;}
function corNota(n){return n==null?'var(--line-2)':n>=80?'var(--ok)':n>=65?'#E9A200':'var(--bad)';}
function stable(o){if(Array.isArray(o))return '['+o.map(stable).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';return JSON.stringify(o);}
async function sha(o){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(stable(o)));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return null;}}
function modal(html){$('#modal').innerHTML=`<div class="modal-bg" data-fecha="1"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#modal [autofocus]')||$('#modal button');f&&f.focus();}
function fechaModal(){$('#modal').innerHTML='';}
document.addEventListener('click',e=>{if(e.target.matches('.modal-bg[data-fecha]'))fechaModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechaModal();});

/* ================= estado ================= */
const S={db:null,user:null,assets:null,dl:null,me:null,podeEditar:false,podeEscrever:true,
  modelo:null,lojas:null,avals:[],pend:[],briefings:[],loaded:{modelo:false,lojas:false,avals:false,pend:false,brief:false},
  view:'painel',curId:null,curLoja:null,filtroReg:'',ordem:'atencao',erroConexao:false,nomes:{}};
const NOME_CHECKLIST='PP - Checklist de Prevenção';

/* ================= nomes de pessoas ================= */
async function resolverNomes(ids){
  ids=[...new Set(ids.filter(Boolean))];
  if(!S.user||!ids.length)return;
  try{const ps=await S.user.profiles(ids);let mudou=false;for(const id of ids){const n=ps[id]?.name||'';if(S.nomes[id]!==n){S.nomes[id]=n;mudou=true;}}if(mudou)render();}catch(e){}
}
const nomeDe=a=>a?.autorTexto||(a?.autor?(S.nomes[a.autor]||'Equipe de Prevenção'):'—');

/* ================= cálculo ================= */
function itensAtivos(modelo){const out=[];for(const ar of (modelo?.areas||[]))for(const it of ar.itens)if(it.ativo!==false)out.push({...it,area:ar.nome,areaId:ar.id});return out;}
function anteriorDe(av){
  const ref=av.inicio||av.criadoEm;
  return S.avals.filter(x=>x.id!==av.id&&x.loja===av.loja&&x.status==='concluida'&&(x.fim||'')<(ref||'9'))
    .sort((a,b)=>(b.fim||'').localeCompare(a.fim||''))[0]||null;
}
const LIMITE_PARCIAL=40; // % do peso não verificado a partir do qual a visita é parcial
function calcular(av,anterior){
  const mod=av.modelo; const res={pontos:0,max:0,nota:null,faixa:null,areas:[],reincidentes:[],naoConformes:0,naoVerificados:0,respondidos:0,total:0,pesoNV:0,pesoBase:0,pctNV:0,parcial:false,reincVerificavel:!!(anterior&&anterior.tipo!=='resumo')};
  const antR=(anterior&&anterior.tipo!=='resumo')?(anterior.respostas||{}):null;
  for(const ar of (mod?.areas||[])){
    const A={id:ar.id,nome:ar.nome,pontos:0,max:0,pct:null,naoConformes:0,naoVerificados:0};
    for(const it of ar.itens){ if(it.ativo===false)continue; res.total++;
      const r=av.respostas?.[it.id]?.r; if(!r)continue; res.respondidos++;
      if(r==='NA')continue;
      const peso=Number(it.peso)||0;
      if(r==='NV'){res.naoVerificados++;A.naoVerificados++;res.pesoNV+=peso;continue;}
      res.pesoBase+=peso;
      const reinc=r==='N'&&antR&&antR[it.id]?.r==='N';
      const pe=reinc?peso*1.5:peso;
      A.max+=pe; if(r==='S')A.pontos+=pe;
      if(r==='N'){A.naoConformes++;res.naoConformes++;if(reinc)res.reincidentes.push(it.id);}
    }
    A.pct=A.max?A.pontos/A.max*100:null; res.areas.push(A); res.pontos+=A.pontos; res.max+=A.max;
  }
  res.nota=res.max?Math.round(res.pontos/res.max*10000)/100:null; res.faixa=faixa(res.nota);
  res.ocGrave=(av.ocorrencias||[]).some(o=>o.grave); if(res.ocGrave&&res.faixa==='A'){res.faixa='B';res.faixaLimitada=true;}
  const base=res.pesoBase+res.pesoNV; res.pctNV=base?Math.round(res.pesoNV/base*1000)/10:0; res.parcial=res.pctNV>LIMITE_PARCIAL;
  return res;
}
/* modelo híbrido: foco · padrão · confirmação rápida */
function historicoDe(av){return S.avals.filter(x=>x.loja===av.loja&&x.status==='concluida'&&x.tipo!=='resumo'&&x.id!==av.id&&(x.fim||'')<(av.inicio||'9')).sort((a,b)=>(b.fim||'').localeCompare(a.fim||''));}
function classificar(av){
  const hist=historicoDe(av); const antR=hist[0]?.respostas||{}; const ult2=hist.slice(0,2);
  const bf={};for(const f of (av.briefing?.foco||[]))bf[f.itemId]=f.motivo;
  const out={};
  for(const it of itensAtivos(av.modelo)){
    const m=[];
    if(bf[it.id])m.push(bf[it.id]);
    if(antR[it.id]?.r==='N')m.push('Reprovado na visita anterior · se reprovar de novo, peso ×1,5');
    if(antR[it.id]?.r==='NV')m.push('Não verificado na visita anterior · verificação obrigatória');
    const janela=hist.slice(0,4);const rep=janela.filter(h=>h.respostas?.[it.id]?.r==='N').length;
    if(rep>=2)m.push(`Reprovado em ${rep} das últimas ${janela.length} visitas`);
    let g='padrao';
    if(m.length)g='foco';
    else if(ult2.length>=2&&ult2.every(h=>h.respostas?.[it.id]?.r==='S'))g='rapida';
    out[it.id]={grupo:g,motivos:[...new Set(m)]};
  }
  return out;
}
function faixaDe(a){const f=faixa(notaDe(a));return ((a.ocorrencias||[]).some(o=>o.grave)&&f==='A')?'B':f;}
function notaDe(av){return av.tipo==='resumo'?av.notaOrigem:(av.resultado?.nota??av.notaOrigem??null);}

/* ================= pendências ================= */
function statusPend(p){if(p.status==='resolvida')return 'resolvida';return new Date(p.prazo)<new Date()?'vencida':'aberta';}

/* ================= inicialização ================= */
async function init(){
  window.addEventListener('hashchange',()=>{lerHash();render();});
  lerHash(); render();
  if(!window.claude||!window.claude.use){S.erroConexao='Abra esta página pelo claude.ai para usar o checklist.';render();return;}
  const [db,user,assets,dl]=await Promise.all(['db','user','assets','downloads'].map(n=>window.claude.use(n).catch(()=>null)));
  S.db=db;S.user=user;S.assets=assets;S.dl=dl;
  if(!db){S.erroConexao='Os dados não estão disponíveis nesta visualização. Entre com sua conta da Loja do Mecânico no claude.ai.';render();return;}
  if(user){try{S.me=await user.me();S.podeEditar=await user.canEdit();const w=await user.can('data.write');S.podeEscrever=w!==false;}catch(e){}}
  const timer=setTimeout(()=>{if(!Object.values(S.loaded).every(Boolean)){S.erroConexao='Ainda não foi possível carregar os dados. Verifique sua conexão; a página atualiza sozinha quando os dados chegarem.';render();}},10000);
  const pronto=k=>{S.loaded[k]=true;if(Object.values(S.loaded).every(Boolean)){clearTimeout(timer);if(S.erroConexao&&S.erroConexao.startsWith('Ainda'))S.erroConexao=false;}};
  const erro=e=>{if(e.code==='revoked')S.erroConexao='O acesso a esta página mudou.';else S.erroConexao='Não foi possível ler os dados ('+e.code+').';render();};
  db.doc('config/modelo').onSnapshot(s=>{S.modelo=s.exists?s.data():null;pronto('modelo');render();},erro);
  db.doc('config/lojas').onSnapshot(s=>{S.lojas=s.exists?(s.data().lojas||[]):[];pronto('lojas');render();},erro);
  db.collection('avaliacoes').onSnapshot(s=>{const srv=s.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))}));if(editando&&(S._salvando||fila.ativo)){const loc=S.avals.find(a=>a.id===editando);if(loc){const i=srv.findIndex(a=>a.id===editando);if(i>=0)srv[i]=loc;else srv.push(loc);}}S.avals=srv;pronto('avals');resolverNomes(S.avals.map(a=>a.autor).concat(S.avals.flatMap(a=>(a.historico||[]).map(h=>h.por))));render();},erro);
  db.collection('briefings').onSnapshot(s=>{S.briefings=s.docs.map(d=>({id:d.id,...d.data()}));pronto('brief');render();},()=>{pronto('brief');});
  db.collection('pendencias').onSnapshot(s=>{S.pend=s.docs.map(d=>({id:d.id,...d.data()}));pronto('pend');resolverNomes(S.pend.map(p=>p.resolvidaPor));render();},erro);
}
function lerHash(){const h=(location.hash||'').slice(1);const ok=['painel','avaliar','pendencias','relatorios','relatorio','loja','importar','configurar'];S.view=ok.includes(h)?h:'painel';if(S.view==='relatorio'&&!S.curId)S.view='relatorios';if(S.view==='loja'&&!S.curLoja)S.view='painel';}

/* ---------- PAINEL ---------- */
function resumoLojas(){
  const out=[];
  for(const l of S.lojas){
    const avs=S.avals.filter(a=>a.loja===l.codigo&&a.status==='concluida').sort((a,b)=>(a.fim||'').localeCompare(b.fim||''));
    const ult=avs[avs.length-1]||null; const nota=ult?notaDe(ult):null;
    const pend=S.pend.filter(p=>p.loja===l.codigo&&p.status!=='resolvida');
    const venc=pend.filter(p=>statusPend(p)==='vencida').length;
    out.push({l,avs,ult,nota,f:ult?faixaDe(ult):null,dias:ult?dias(ult.fim):null,pend:pend.length,venc,hist:avs.slice(-6).map(notaDe)});
  }
  return out;
}
function spark(vals){
  const v=vals.filter(x=>x!=null); if(v.length<2)return '';
  const W=220,H=34,min=Math.min(40,...v),max=100; const pts=v.map((y,i)=>[i*(W-8)/(v.length-1)+4,H-4-(y-min)/(max-min)*(H-8)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const l=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Últimas notas: ${v.map(x=>nf1.format(x)).join(', ')}"><path d="${d}" fill="none" stroke="var(--linha)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${l[0]}" cy="${l[1]}" r="3.5" fill="var(--laranja)"/></svg>`;
}

  </div>
  ${rasc.length?`<div class="card" style="margin-bottom:18px"><h2>Visitas em andamento</h2>${rasc.map(a=>`<div class="row" style="padding:6px 0"><b>${esc(lojaNome(a.loja))}</b><span class="mini">iniciada em ${horaBR(a.inicio)} por ${esc(nomeDe(a))} · ${calcular(a,null).respondidos} de ${calcular(a,null).total} itens</span><span class="spacer"></span><button class="btn peq" data-acao="continuar" data-id="${a.id}">Continuar</button></div>`).join('')}</div>`:''}
  ${top.length?`<div class="card" style="margin-bottom:18px"><h2>Itens que mais reprovam na rede</h2><p class="mini" style="margin-top:-6px">Últimos 90 dias · número de lojas com o item em “Não”. Recorrência em várias lojas costuma indicar problema de processo ou de treinamento, não de uma loja só.</p>${top.map(t=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="chip ${t.n>=3?'bad':'warn'}">${t.n} ${t.n>1?'lojas':'loja'}</span><span>${esc(t.it.texto)}</span><span class="mini">${esc(t.it.area)} · peso ${t.it.peso}</span></div>`).join('')}</div>`:''}
  <div class="row no-print" style="margin-bottom:12px">
    <select id="fReg" style="max-width:220px" aria-label="Região"><option value="">Todas as regiões</option>${regs.map(r=>`<option ${S.filtroReg===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
    <select id="fOrd" style="max-width:240px" aria-label="Ordenar"><option value="atencao" ${S.ordem==='atencao'?'selected':''}>Ordenar: precisam de atenção</option><option value="tempo" ${S.ordem==='tempo'?'selected':''}>Ordenar: mais tempo sem visita</option><option value="nota" ${S.ordem==='nota'?'selected':''}>Ordenar: menor nota</option><option value="nome" ${S.ordem==='nome'?'selected':''}>Ordenar: nome</option></select>
  </div>
  <div class="grid lojas">${lista.map(r=>`
    <button class="card loja" data-acao="loja" data-loja="${r.l.codigo}">

      ${spark(r.hist)}
      <div class="row" style="gap:6px">
        <span class="chip ${r.dias==null?'':r.dias>120?'bad':r.dias>60?'warn':'ok'}">${r.dias==null?'Sem visita registrada':r.dias<=0?'Visita hoje':r.dias===1?'Visita ontem':'Visita há '+r.dias+' dias'}</span>

      </div>

function origemTxt(a){return a.origem==='checklistfacil'?'Checklist Fácil':a.origem==='documento'?esc(a.fonte||'Documento'):'SENNA';}
function grafHist(avs){
  const v=avs.map(a=>({n:notaDe(a),d:a.fim})).filter(x=>x.n!=null); if(!v.length)return '<p class="mini">Sem visitas.</p>';

  const x=i=>L+PAD+(v.length===1?(W-L-R-2*PAD)/2:i*(W-L-R-2*PAD)/(v.length-1)); const y=n=>T+(100-n)/(100-min)*(H-T-B);

  const grid=[40,45,65,80,95,100].map(n=>`<line x1="${L}" x2="${W-R}" y1="${y(n)}" y2="${y(n)}" stroke="var(--line)"/><text x="${L-6}" y="${y(n)+4}" text-anchor="end" font-size="11" fill="var(--soft)">${n}</text>`).join('');

  return `<div class="tabela-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px" role="img" aria-label="Evolução das notas">${bands}${grid}<path d="${d}" fill="none" stroke="var(--linha)" stroke-width="2.5"/>${v.map((p,i)=>`<circle cx="${x(i)}" cy="${y(Math.max(min,p.n))}" r="5" fill="${corNota(p.n)}"/><text x="${x(i)}" y="${y(Math.max(min,p.n))-10}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--text)">${nf1.format(p.n)}</text><text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--soft)">${new Date(p.d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})}</text>`).join('')}</svg></div>`;
}

function vAvaliar(){
  const av=editando&&S.avals.find(a=>a.id===editando&&a.status==='rascunho');
  if(!av){editando=null;
    if(!S.podeEscrever)return `<div class="aviso">Seu acesso a esta página é só de leitura. Peça ao responsável para te adicionar como colaborador.</div>`;

    return `<h1>Nova visita</h1><p class="sub">Escolha a loja. O início da visita, o autor e a localização ficam registrados automaticamente. Se houver briefing do “Senna, o pai tá on” para a loja, ele entra sozinho.</p>

    <button class="btn pri" data-acao="iniciar" style="margin-top:8px">Iniciar visita</button></div>`;
  }

  const antTxt=ant?`Visita anterior: ${dataBR(ant.fim)} · ${pct(notaDe(ant))}${ant.tipo==='resumo'?' · sem detalhe por item, reincidência não verificável':''}`:'Primeira visita registrada nesta loja · sem reincidência a verificar';

  <p class="sub">Iniciada em ${horaBR(av.inicio)} · ${esc(nomeDe(av))} · ${antTxt}</p>`;

function pos_avaliar(){

  const c=$('#assCanvas'); if(c&&!c._ok){c._ok=true;const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0B1440';
    S._ass=S._ass&&S._ass.av===editando?S._ass:{av:editando,tracos:[]};
    const desenhar=()=>{for(const t of S._ass.tracos){x.beginPath();t.forEach(([a,b],k)=>k?x.lineTo(a,b):x.moveTo(a,b));x.stroke();}};
    desenhar(); c._vazio=!S._ass.tracos.some(t=>t.length>1); let atual=null;
    const p=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
    c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);atual=[p(e)];S._ass.tracos.push(atual);x.beginPath();x.moveTo(...atual[0]);});
    c.addEventListener('pointermove',e=>{if(!atual)return;const q=p(e);atual.push(q);x.lineTo(...q);x.stroke();c._vazio=false;});
    ['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>atual=null));}
}

function geo(){return new Promise(res=>{if(!navigator.geolocation)return res(null);const t=setTimeout(()=>res(null),6000);navigator.geolocation.getCurrentPosition(p=>{clearTimeout(t);res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),prec:Math.round(p.coords.accuracy)});},()=>{clearTimeout(t);res(null);},{enableHighAccuracy:true,timeout:5500,maximumAge:60000});});}

async function comprimir(file){
  const bmp=await createImageBitmap(file); const m=1600; const k=Math.min(1,m/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
}

  <div class="row" style="margin:10px 0 14px">${selo(res.faixa,'selo-mini')}<div><div class="nota">${res.nota==null?'—':nf.format(res.nota)+'%'}</div><div class="mini">Faixa ${res.faixa||'—'} · ${res.naoConformes} não conformidade${res.naoConformes===1?'':'s'}${res.reincidentes.length?' · '+res.reincidentes.length+' reincidente'+(res.reincidentes.length>1?'s':''):''}${res.naoVerificados?' · '+res.naoVerificados+' não verificado'+(res.naoVerificados>1?'s':''):''}</div></div></div>

  ${semFoto.length?`<div class="aviso">${semFoto.length} ${semFoto.length>1?'itens “Não” estão sem foto':'item “Não” está sem foto'}. A foto é a evidência em caso de questionamento.</div>`:''}
  <p class="mini">Depois de concluída, a visita fica travada e recebe um código de integridade. Cada “Não” e cada ocorrência viram pendência com prazo de 7 dias. Itens “Não verificado” voltam como foco obrigatório na próxima visita.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn" data-acao="fecha-modal">Voltar</button><button class="btn pri" data-acao="confirmar-conclusao" autofocus>Concluir</button></div>`);
}
async function confirmarConclusao(){
  const av=avAtual(); if(!av)return; fechaModal(); toast('Concluindo…');
  const g=await geo(); const fim=new Date().toISOString(); const ant=anteriorDe(av); const res=calcular(av,ant); const cls=classificar(av);
  const c=JSON.parse(JSON.stringify(av)); c.status='concluida'; c.fim=fim; c.coords=c.coords||{}; c.coords.fim=g; c.anteriorId=ant?.id||null; c.resultado=res;
  c.grupos=Object.fromEntries(Object.entries(cls).map(([k,v])=>[k,v.grupo]));
  c.integridade=await sha(baseHash(c,res.nota));
  try{ clearTimeout(fila.t); while(fila.ativo)await new Promise(r=>setTimeout(r,150)); fila.pend=null;
    const {id,...body}=c; await S.db.doc('avaliacoes/'+id).set(body); {const i=S.avals.findIndex(x=>x.id===id); if(i>=0)S.avals[i]=c;}
    const idx=Object.fromEntries(itensAtivos(c.modelo).map(i=>[i.id,i]));
    for(const [itemId,r] of Object.entries(c.respostas)){ if(r.r!=='N')continue; const it=idx[itemId]; if(!it)continue; if(S.pend.some(p=>p.id===id+'__'+itemId&&p.status==='resolvida'))continue;
      await S.db.doc('pendencias/'+id+'__'+itemId).set({avaliacao:id,loja:c.loja,itemId,texto:it.texto,area:it.area,peso:Number(it.peso)||0,reincidente:res.reincidentes.includes(itemId),comentario:r.com||'',fotos:r.fotos||[],criadaEm:fim,prazo:addDias(fim,7),status:'aberta'});}
    for(const oc of (c.ocorrencias||[])){const pid=id+'__oc-'+oc.id; if(S.pend.some(p=>p.id===pid&&p.status==='resolvida'))continue;
      await S.db.doc('pendencias/'+pid).set({avaliacao:id,loja:c.loja,tipo:'ocorrencia',texto:'Ocorrência: '+oc.descricao,area:oc.area,peso:0,reincidente:false,comentario:[oc.diagnostico&&('Diagnóstico: '+oc.diagnostico),oc.proximo&&('Próximo passo: '+oc.proximo)].filter(Boolean).join(' · '),fotos:[],criadaEm:fim,prazo:addDias(fim,7),status:'aberta'});}
    S._salvando=false; S.curId=id; editando=null; ir('relatorio'); setTimeout(verificarHash,300); toast('Visita concluída');
  }catch(e){toast(e.code==='invalid_argument'?'Sem permissão para concluir.':'Não foi possível concluir agora. Tente de novo.');}
}

function baseHash(a,nota){const o={loja:a.loja,inicio:a.inicio,fim:a.fim,autor:a.autor,respostas:a.respostas,assinatura:a.assinatura||null,modeloVersao:a.modeloVersao,nota};if(a.ocorrencias&&a.ocorrencias.length)o.ocorrencias=a.ocorrencias;return o;}
async function verificarHash(){const av=S.avals.find(a=>a.id===S.curId);const el=$('#hashOk');if(!av||!el||!av.integridade)return;
  const h=await sha(baseHash(av,av.resultado?.nota));
  el.innerHTML=h===av.integridade?'<span class="chip ok">Conferido · sem alteração</span>':'<span class="chip bad">Divergente · registro alterado após a conclusão</span>';}
function textoEmail(av){
  const ant=av.anteriorId?S.avals.find(a=>a.id===av.anteriorId):anteriorDe(av); const res=av.origem==='checklistfacil'&&av.resultado?av.resultado:calcular(av,ant); const nota=notaDe(av)??res.nota;
  const idx=Object.fromEntries(itensAtivos(av.modelo).map(i=>[i.id,i]));
  const naos=Object.entries(av.respostas||{}).filter(([id,r])=>r.r==='N'&&idx[id]).map(([id,r])=>({it:idx[id],r,reinc:res.reincidentes.includes(id),pe:(Number(idx[id].peso)||0)*(res.reincidentes.includes(id)?1.5:1)})).sort((a,b)=>b.pe-a.pe);
  const nomeG=(av.assinatura?.nome||'').trim().split(' ')[0]||'gestor(a)';
  const L=[`Bom dia, ${nomeG}`,'',`Sua loja recebeu a visita do time de Prevenção de Perdas no dia ${dataBR(av.fim)}.`,'Com base na visita, foi elaborado um relatório com as oportunidades de melhoria a serem realizadas em loja.','',`A nota final da loja ficou em ${faixaDe(av)}, com ${nf.format(nota)}%${(av.ocorrencias||[]).some(o=>o.grave)&&faixa(nota)==='A'?' (faixa limitada a B em razão de ocorrência grave registrada na visita)':''}.`,'',naos.length?`Dos pontos verificados, a loja teve ${naos.length} ${naos.length===1?'ponto':'pontos'} em desconformidade. Abaixo, os mais sensíveis para a operação:`:'Nenhum dos pontos verificados ficou em desconformidade.'];
  naos.slice(0,5).forEach(n=>L.push(`• ${n.it.texto}${n.reinc?' (reincidente)':''}${n.r.com?' — '+n.r.com:''}`));
  if(naos.length>5)L.push(`• e mais ${naos.length-5} ${naos.length-5===1?'ponto':'pontos'}, detalhados no relatório.`);
  if(res.naoVerificados)L.push('',`Nesta visita, ${res.naoVerificados} ${res.naoVerificados===1?'ponto não pôde ser verificado':'pontos não puderam ser verificados'}${res.parcial?' (visita parcial)':''}; ${res.naoVerificados===1?'ele será prioridade':'eles serão prioridade'} na próxima visita.`);
  if((av.ocorrencias||[]).length){L.push('','Ocorrências registradas na visita:');av.ocorrencias.forEach(o=>L.push(`• ${o.area}: ${o.descricao}${o.proximo?' — próximo passo: '+o.proximo:''}`));}
  L.push('','Resultado por área:');res.areas.filter(a=>a.pct!=null).sort((a,b)=>a.pct-b.pct).forEach(a=>L.push(`• ${a.nome}: ${nf1.format(a.pct)}%`));
  L.push('',`Prazo para ajuste dos pontos e retorno da loja: 7 dias após o recebimento deste e-mail (até ${dataBR(addDias(av.fim,7))}).`,'','Equipe de Prevenção de Perdas · Loja do Mecânico');
  return L.join('\n');
}

async function exportar(){
  const avs=S.avals.filter(a=>a.status==='concluida'&&a.tipo!=='resumo');
  const head=['Código da avaliação','Origem','Código da Unidade','Unidade','Região/Grupo','Nome do checklist','Versão do modelo','Autor','Área','Código do item','Item','Resposta','Peso','Peso aplicado','Reincidente','Data inicial','Data final','Resultado','Faixa','Comentário do item','Fotos','Grupo S.E.N.N.A.','Confirmado em bloco','Visita parcial'];
  const q=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const rows=[head.join(';')];
  for(const a of avs){const ant=a.anteriorId?S.avals.find(x=>x.id===a.anteriorId):anteriorDe(a);const res=a.origem==='checklistfacil'&&a.resultado?a.resultado:calcular(a,ant);const nota=notaDe(a)??res.nota;const l=S.lojas.find(x=>x.codigo===a.loja)||{};
    for(const ar of a.modelo.areas)for(const it of ar.itens){if(it.ativo===false)continue;const r=a.respostas?.[it.id]||{};const re=res.reincidentes.includes(it.id);
      rows.push([a.codigoOrigem||a.id,origemTxt(a),a.loja,l.nome||'',l.regiao||'',a.checklist||NOME_CHECKLIST,a.modeloVersao??'',nomeDe(a),ar.nome,it.id,it.texto,{S:'Sim',N:'Não',NA:'Não se aplica',NV:'Não verificado'}[r.r]||'',it.peso,(r.r==='NA'||r.r==='NV')?0:(Number(it.peso)||0)*(re?1.5:1),re?'Sim':'Não',horaBR(a.inicio),horaBR(a.fim),nf.format(nota),faixaDe(a),r.com||'',(r.fotos||[]).length,{foco:'Foco',padrao:'Padrão',rapida:'Confirmação rápida'}[a.grupos?.[it.id]]||'',r.lote?'Sim':'Não',res.parcial?'Sim':'Não'].map(q).join(';'));}}
  try{await S.dl.save({filename:'senna-checklist-'+new Date().toISOString().slice(0,10)+'.csv',data:'\ufeff'+rows.join('\r\n')});}catch(e){if(e.code!=='declined')toast('Não foi possível gerar o arquivo.');}
}
let XLSXlib=null;
function carregarXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s);});}
const parseBR=s=>{if(!s)return null;const m=String(s).match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})(?::(\d{2}))?/);if(!m)return null;return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0)).toISOString();};

let IMP=null;
const numBR=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v||'').replace(/\./g,'').replace(',','.'));return isNaN(n)?null:n;};
const numPeso=v=>{if(typeof v==='number')return v;const n=parseFloat(String(v||'').replace(',','.'));return isNaN(n)?0:n;};
function dataISO(v){if(!v)return null;if(v instanceof Date&&!isNaN(v))return v.toISOString();return parseBR(v);}
function lojaPorUnidade(txt){const un=norm(txt).replace(/^loja (de |do |da )?/,'').replace(/^filial\s*\d*\s*-?\s*/,'');if(!un)return null;
  const num=String(txt).match(/\b(\d{1,3})\b/);if(num){const l=S.lojas.find(x=>x.codigo===+num[1]);if(l)return l;}
  return S.lojas.find(l=>un===norm(l.nome))||S.lojas.find(l=>un.includes(norm(l.nome))||norm(l.nome).includes(un))||null;}
async function lerArquivos(files){
  files=[...files].filter(f=>/\.xlsx?$/i.test(f.name)); if(!files.length){toast('Envie arquivos .xlsx exportados do Checklist Fácil.');return;}
  IMP={lendo:true,arquivos:files.map(f=>f.name),erros:[],itens:[],gravando:false,feito:null}; ir('importar');
  let X; try{X=await carregarXLSX();}catch(e){IMP.lendo=false;IMP.erros.push('Não foi possível carregar o leitor de planilhas. Verifique a conexão.');render();return;}
  const grupos={};
  for(const f of files){try{const wb=X.read(await f.arrayBuffer(),{cellDates:true});let achou=0;
      for(const sn of wb.SheetNames){const rows=X.utils.sheet_to_json(wb.Sheets[sn],{defval:''});for(const r of rows){const k=String(r['Código da avaliação']||'').trim();if(!k||!r['Item'])continue;(grupos[k]=grupos[k]||[]).push(r);achou++;}}
      if(!achou)IMP.erros.push(f.name+': não encontrei as colunas da exportação “itens por linha” (Código da avaliação, Item, Resposta).');
    }catch(e){IMP.erros.push(f.name+': arquivo não pôde ser lido.');}}
  for(const [cod,rs] of Object.entries(grupos)){
    const areas=[],aIdx={},resp={};let fotos=0;const vistos=new Set();
    for(const r of rs){const aid=String(r['Código da área']||norm(r['Área'])||'geral');
      if(!aIdx[aid]){aIdx[aid]={id:aid,nome:String(r['Área']||'Geral'),itens:[]};areas.push(aIdx[aid]);}
      const iid=String(r['Código do item']||('t-'+norm(r['Item']).slice(0,60)));if(vistos.has(iid))continue;vistos.add(iid);
      aIdx[aid].itens.push({id:iid,texto:String(r['Item']).trim(),peso:numPeso(r['Peso']),obrigatorio:true,ativo:true});
      const rr={'sim':'S','nao':'N','nao se aplica':'NA'}[norm(r['Resposta'])];
      if(rr){resp[iid]={r:rr};const c=String(r['Comentário do item']||'').trim();if(c)resp[iid].com=c;}
      fotos+=String(r['Imagens']||'').split(/\s+/).filter(x=>/^https?:/.test(x)).length;}
    const r0=rs[0];const loja=lojaPorUnidade(r0['Unidade']);const nomeCk=String(r0['Nome do checklist']||'');
    const ini=dataISO(r0['Data inicial']);const fim=dataISO(r0['Data final'])||ini;
    const notaCF=numBR(r0['Resultado']);const calc=calcular({modelo:{areas},respostas:resp},null);
    const id='cf-'+cod;const existe=S.avals.some(a=>a.id===id);const outro=nomeCk&&!norm(nomeCk).includes('prevencao');
    const status=existe?'existe':!loja?'semloja':!fim?'semdata':outro?'outro':'nova';
    const resumo=loja&&fim?S.avals.find(a=>a.tipo==='resumo'&&a.loja===loja.codigo&&dataBR(a.fim)===dataBR(fim)):null;
    IMP.itens.push({id,cod,loja,resumo:resumo?.id||null,unidade:String(r0['Unidade']||''),fim,nota:notaCF??calc.nota,calc:calc.nota,naos:calc.naoConformes,itens:vistos.size,fotos,status,marcado:status==='nova',
      doc:{loja:loja?.codigo??null,status:'concluida',tipo:'completa',origem:'checklistfacil',codigoOrigem:cod,checklist:nomeCk||NOME_CHECKLIST,modeloVersao:'Checklist Fácil',modelo:{areas},autorTexto:String(r0['Autor']||''),inicio:ini,fim,criadoEm:new Date().toISOString(),respostas:resp,notaOrigem:notaCF??calc.nota,fotosExternas:fotos,historico:[]}});
  }
  IMP.itens.sort((a,b)=>(a.unidade.localeCompare(b.unidade))||((a.fim||'').localeCompare(b.fim||'')));
  IMP.lendo=false;render();
}

  return head+`${IMP.erros.map(e=>`<div class="aviso erro">${esc(e)}</div>`).join('')}
  <div class="card"><div class="row"><h2 style="margin:0">Prévia · ${IMP.itens.length} visita${IMP.itens.length===1?'':'s'} em ${IMP.arquivos.length} arquivo${IMP.arquivos.length>1?'s':''}</h2><span class="spacer"></span><button class="btn" data-acao="imp-novo">Trocar arquivos</button><button class="btn pri" data-acao="imp-gravar" ${marc&&!IMP.gravando?'':'disabled'}>${IMP.gravando?'Gravando '+IMP.gravando:'Importar '+marc+' visita'+(marc===1?'':'s')}</button></div>
  <div class="row" style="margin:10px 0 4px;gap:6px"><span class="chip ok">${cont('nova')} novas</span>${cont('existe')?`<span class="chip">${cont('existe')} já importadas</span>`:''}${cont('semloja')?`<span class="chip bad">${cont('semloja')} sem loja</span>`:''}${cont('outro')?`<span class="chip warn">${cont('outro')} de outro checklist</span>`:''}${marc?`<span class="chip">${lojasN} loja${lojasN===1?'':'s'}</span>`:''}</div>
  ${cont('semloja')?`<div class="aviso">Visitas “sem loja”: a unidade do arquivo não bateu com o cadastro (${esc([...new Set(IMP.itens.filter(i=>i.status==='semloja').map(i=>i.unidade))].join(', '))}). Ajuste o nome em Configurar e envie de novo.</div>`:''}
  ${div?`<div class="aviso info">Em ${div} visita${div===1?'':'s'}, a nota recalculada difere da nota do Checklist Fácil. Isso é esperado quando houve reincidência (peso ×1,5) na época. O SENNA guarda e exibe a nota original.</div>`:''}
  <div class="tabela-wrap" style="margin-top:8px"><table><thead><tr><th><input type="checkbox" id="impTodos" aria-label="Marcar todas" ${marc&&marc===cont('nova')+cont('outro')?'checked':''}></th><th>Loja</th><th>Data</th><th>Nota</th><th>Itens</th><th>“Não”</th><th>Situação</th></tr></thead><tbody>
  ${IMP.itens.map((i,k)=>`<tr><td>${['nova','outro'].includes(i.status)?`<input type="checkbox" data-imp="${k}" ${i.marcado?'checked':''} aria-label="Importar">`:''}</td><td>${i.loja?esc(i.loja.nome):`<span style="color:var(--bad)">${esc(i.unidade||'—')}</span>`}<div class="mini">#${esc(i.cod)}</div></td><td>${dataBR(i.fim)}</td><td><b>${pct(i.nota)}</b>${i.calc!=null&&i.nota!=null&&Math.abs(i.calc-i.nota)>0.05?`<div class="mini">recalculada ${pct(i.calc)}</div>`:''}</td><td>${i.itens}</td><td>${i.naos}</td><td><span class="chip ${ST[i.status][0]}">${ST[i.status][1]}</span>${i.resumo&&i.status==='nova'?'<div class="mini">substitui a nota resumida da mesma data</div>':''}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}
async function gravarImport(){
  const sel=IMP.itens.filter(i=>i.marcado&&i.loja);let ok=0,falha=0;
  for(const [n,i] of sel.entries()){IMP.gravando=`${n+1}/${sel.length}`;render();
    try{await S.db.doc('avaliacoes/'+i.id).set(i.doc);ok++;if(i.resumo){try{await S.db.doc('avaliacoes/'+i.resumo).delete();}catch(e2){}}}catch(e){falha++;if(e.code==='quota_exceeded'){toast('Limite de armazenamento atingido.');break;}if(e.code==='invalid_argument'){toast('Sem permissão para gravar.');break;}}}
  IMP.gravando=false;IMP.feito={ok,falha};render();
}
$('#arqImport').addEventListener('change',e=>{const fs=e.target.files;if(fs&&fs.length)lerArquivos(fs);e.target.value='';});
document.addEventListener('dragover',e=>{if(S.view==='importar'){e.preventDefault();$('#dropZona')?.classList.add('sobre');}});
document.addEventListener('dragleave',e=>{if(e.target.id==='dropZona')e.target.classList.remove('sobre');});
document.addEventListener('drop',e=>{if(S.view!=='importar')return;e.preventDefault();const fs=e.dataTransfer?.files;if(fs&&fs.length)lerArquivos(fs);});
document.addEventListener('click',e=>{const b=e.target.closest('[data-acao]');if(!b)return;
  if(b.dataset.acao==='imp-novo'){IMP=null;render();}
  else if(b.dataset.acao==='imp-gravar'){gravarImport();}});
document.addEventListener('change',e=>{const t=e.target;if(!IMP)return;
  if(t.dataset.imp){IMP.itens[+t.dataset.imp].marcado=t.checked;render();}
  else if(t.id==='impTodos'){IMP.itens.forEach(i=>{if(['nova','outro'].includes(i.status))i.marcado=t.checked;});render();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.id==='dropZona'){e.preventDefault();$('#arqImport').click();}});

init();

})();
</script>
</body>
</html>
